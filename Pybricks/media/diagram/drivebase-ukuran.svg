<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="judul uraian">
  <title id="judul">Arti wheel_diameter dan axle_track, tampak depan</title>
  <desc id="uraian">Robot dilihat dari depan. wheel_diameter adalah tinggi roda dari lantai sampai puncak ban. axle_track adalah jarak antara titik sentuh roda kiri dan roda kanan ke lantai, bukan panjang as yang menonjol di kedua sisi.</desc>
  <style>
    .bg{fill:#f7f5f0}
    .txt{fill:#1f2530;font:500 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .muted{fill:#626a77}
    .cap{fill:#626a77;font:650 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.14em}
    .motor{fill:#fbfbfa;stroke:#1f2530;stroke-width:1.25}
    .hub{fill:#1e7b83;stroke:#12494e;stroke-width:1.25}
    .hubtxt{fill:#e8f7f8;font:650 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.06em}
    .tire{fill:#2a2e35;stroke:#1f2530;stroke-width:1.25}
    .tread{stroke:#474d57;stroke-width:1.5}
    .axle{stroke:#8a919c;stroke-width:5;stroke-linecap:round}
    .floor{stroke:#1f2530;stroke-width:1.5}
    .hatch{stroke:#b9b4a9;stroke-width:1}
    .dim{stroke:#c2410c;stroke-width:1.25;fill:none}
    .ext{stroke:#c2410c;stroke-width:.75;opacity:.7}
    .dimfill{fill:#c2410c}
    .dimtxt{fill:#c2410c;font:650 13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-weight:600}
    .no{stroke:#8a919c;stroke-width:1.25;stroke-dasharray:5 4;fill:none}
    .noext{stroke:#8a919c;stroke-width:.75;stroke-dasharray:3 3}
    .nofill{fill:#8a919c}
    .contact{fill:#c2410c}
    @media (prefers-color-scheme: dark){
      .bg{fill:#161a20}
      .txt{fill:#e3e6eb}
      .muted,.cap{fill:#98a0ad}
      .motor{fill:#d3d7dd;stroke:#aab1bc}
      .hub{fill:#2a9aa3;stroke:#7fd0d6}
      .tire{fill:#0c0e11;stroke:#aab1bc}
      .tread{stroke:#2f343c}
      .axle{stroke:#6b7380}
      .floor{stroke:#d7dbe2}
      .hatch{stroke:#3a404b}
      .dim,.ext{stroke:#fb8a4c}
      .dimfill,.contact{fill:#fb8a4c}
      .dimtxt{fill:#fb8a4c}
      .no,.noext{stroke:#6b7380}
      .nofill{fill:#6b7380}
    }
  </style>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" class="dimfill"/>
    </marker>
    <marker id="panah-abu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" class="nofill"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="380" rx="14"/>
  <text class="cap" x="40" y="48">TAMPAK DEPAN</text>

  <!-- panjang as: bukan ini -->
  <line class="noext" x1="176" y1="222" x2="176" y2="96"/>
  <line class="noext" x1="784" y1="222" x2="784" y2="96"/>
  <line class="no" x1="178" y1="104" x2="782" y2="104" marker-start="url(#panah-abu)" marker-end="url(#panah-abu)"/>
  <rect class="bg" x="382" y="94" width="196" height="20"/>
  <text class="txt muted" x="480" y="109" text-anchor="middle">panjang as — bukan axle_track</text>

  <!-- lantai -->
  <line class="floor" x1="100" y1="280" x2="860" y2="280"/>
  <g class="hatch">
    <line x1="108" y1="290" x2="118" y2="280"/><line x1="124" y1="290" x2="134" y2="280"/><line x1="140" y1="290" x2="150" y2="280"/><line x1="156" y1="290" x2="166" y2="280"/>
    <line x1="172" y1="290" x2="182" y2="280"/><line x1="188" y1="290" x2="198" y2="280"/><line x1="236" y1="290" x2="246" y2="280"/><line x1="252" y1="290" x2="262" y2="280"/>
    <line x1="268" y1="290" x2="278" y2="280"/><line x1="284" y1="290" x2="294" y2="280"/><line x1="300" y1="290" x2="310" y2="280"/><line x1="316" y1="290" x2="326" y2="280"/>
    <line x1="332" y1="290" x2="342" y2="280"/><line x1="348" y1="290" x2="358" y2="280"/><line x1="364" y1="290" x2="374" y2="280"/><line x1="380" y1="290" x2="390" y2="280"/>
    <line x1="396" y1="290" x2="406" y2="280"/><line x1="412" y1="290" x2="422" y2="280"/><line x1="428" y1="290" x2="438" y2="280"/><line x1="444" y1="290" x2="454" y2="280"/>
    <line x1="460" y1="290" x2="470" y2="280"/><line x1="476" y1="290" x2="486" y2="280"/><line x1="492" y1="290" x2="502" y2="280"/><line x1="508" y1="290" x2="518" y2="280"/>
    <line x1="524" y1="290" x2="534" y2="280"/><line x1="540" y1="290" x2="550" y2="280"/><line x1="556" y1="290" x2="566" y2="280"/><line x1="572" y1="290" x2="582" y2="280"/>
    <line x1="588" y1="290" x2="598" y2="280"/><line x1="604" y1="290" x2="614" y2="280"/><line x1="620" y1="290" x2="630" y2="280"/><line x1="636" y1="290" x2="646" y2="280"/>
    <line x1="652" y1="290" x2="662" y2="280"/><line x1="668" y1="290" x2="678" y2="280"/><line x1="684" y1="290" x2="694" y2="280"/><line x1="700" y1="290" x2="710" y2="280"/>
    <line x1="764" y1="290" x2="774" y2="280"/><line x1="780" y1="290" x2="790" y2="280"/><line x1="796" y1="290" x2="806" y2="280"/><line x1="812" y1="290" x2="822" y2="280"/>
    <line x1="828" y1="290" x2="838" y2="280"/><line x1="844" y1="290" x2="854" y2="280"/>
  </g>

  <!-- as, motor, hub -->
  <line class="axle" x1="176" y1="230" x2="784" y2="230"/>
  <rect class="motor" x="236" y="198" width="100" height="64" rx="10"/>
  <rect class="motor" x="624" y="198" width="100" height="64" rx="10"/>
  <rect class="hub" x="330" y="194" width="300" height="70" rx="12"/>
  <text class="hubtxt" x="480" y="234" text-anchor="middle">hub</text>

  <!-- roda -->
  <rect class="tire" x="200" y="180" width="36" height="100" rx="9"/>
  <rect class="tire" x="724" y="180" width="36" height="100" rx="9"/>
  <g class="tread">
    <line x1="207" y1="186" x2="207" y2="274"/><line x1="218" y1="186" x2="218" y2="274"/><line x1="229" y1="186" x2="229" y2="274"/>
    <line x1="731" y1="186" x2="731" y2="274"/><line x1="742" y1="186" x2="742" y2="274"/><line x1="753" y1="186" x2="753" y2="274"/>
  </g>

  <!-- titik sentuh -->
  <circle class="contact" cx="218" cy="280" r="4.5"/>
  <circle class="contact" cx="742" cy="280" r="4.5"/>

  <!-- wheel_diameter -->
  <line class="ext" x1="198" y1="180" x2="152" y2="180"/>
  <line class="ext" x1="198" y1="280" x2="152" y2="280"/>
  <line class="dim" x1="162" y1="182" x2="162" y2="278" marker-start="url(#panah)" marker-end="url(#panah)"/>
  <text class="dimtxt mono" x="150" y="226" text-anchor="end">wheel_diameter</text>
  <text class="txt muted" x="150" y="244" text-anchor="end">puncak ban ke lantai</text>

  <!-- axle_track -->
  <line class="ext" x1="218" y1="286" x2="218" y2="326"/>
  <line class="ext" x1="742" y1="286" x2="742" y2="326"/>
  <line class="dim" x1="220" y1="318" x2="740" y2="318" marker-start="url(#panah)" marker-end="url(#panah)"/>
  <rect class="bg" x="424" y="308" width="112" height="20"/>
  <text class="dimtxt mono" x="480" y="323" text-anchor="middle">axle_track</text>
  <text class="txt muted" x="480" y="350" text-anchor="middle">diukur antar titik sentuh roda ke lantai</text>
</svg>
